<script>
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD=['','Mo','Di','Mi','Do','Fr','Sa','So'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function icsToText(txt){
  const un=txt.replace(/\r?\n[ \t]/g,'');const ev=un.split('BEGIN:VEVENT').slice(1),seen={};
  const tm=v=>{const m=v.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)(Z?)/);if(!m)return null;return m[7]?new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5])):new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5])};
  ev.forEach(e=>{const g=k=>{const m=e.match(new RegExp('\\n'+k+'[^:\\n]*:([^\\n]*)'));return m?m[1].trim():''};
    const a=tm(g('DTSTART')),b=tm(g('DTEND'));if(!a)return;const wd=((a.getDay()+6)%7)+1;if(wd>5)return;
    const t=x=>pad(x.getHours())+':'+pad(x.getMinutes());
    const k=WD[wd]+' '+t(a)+(b?'-'+t(b):'')+' | '+(g('SUMMARY')+' '+g('LOCATION')).trim();seen[k]=1});
  return Object.keys(seen).sort().slice(0,250).join('\n');
}
async function shrinkImage(f){
  try{const bmp=await createImageBitmap(f),sc=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');
    c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||f),'image/jpeg',0.9))}catch(e){return f}
}
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  await new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';sc.onload=ok;sc.onerror=()=>no(new Error('pdf'));document.head.appendChild(sc)});
  window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return window.pdfjsLib;
}
async function readPdf(f){
  const lib=await loadPdfJs(),doc=await lib.getDocument({data:await f.arrayBuffer()}).promise;let txt='';
  for(let i=1;i<=Math.min(doc.numPages,3);i++){
    const pg=await doc.getPage(i),tc=await pg.getTextContent(),rows={};
    tc.items.forEach(it=>{const t=(it.str||'').trim();if(!t)return;const y=Math.round(it.transform[5]/4);(rows[y]=rows[y]||[]).push([it.transform[4],t])});
    txt+=Object.keys(rows).map(Number).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]+'['+Math.round(x[0])+']').join(' ')).join('\n')+'\n\n';
  }
  if(txt.replace(/\s/g,'').length>60)return {text:txt};
  const pg=await doc.getPage(1),vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return {image:await new Promise(r=>c.toBlob(r,'image/jpeg',0.9))};
}
async function readTimetable(f){
  const sample=window.claude&&claude.use?await claude.use('sample'):null;
  if(!sample)throw {message:'Die automatische Erkennung ist in dieser Ansicht nicht verfügbar.'};
  const ext=(f.name.split('.').pop()||'').toLowerCase(),isImg=/^image\//.test(f.type)||['png','jpg','jpeg','webp'].includes(ext);
  let pdfIn=null;if(ext==='pdf'){try{pdfIn=await readPdf(f)}catch(e){throw {message:'Die PDF konnte nicht gelesen werden. Bitte mache einen Screenshot des Stundenplans und lade ihn als Bild hoch.'}}}
  const prompt='Das ist der persönliche Stundenplan einer Lehrkraft an einer österreichischen AHS (Wochenplan, Montag bis Freitag). Extrahiere (1) das Stundenraster mit Beginn- und Endzeit jeder Unterrichtsstunde genau so, wie es im Plan steht (24-Stunden-Format HH:MM, z. B. "08:00" bis "08:50"), und (2) jede Unterrichtsstunde der Lehrkraft mit Wochentag, Stundennummer (1., 2., 3. Stunde, keine Uhrzeit), den Klassen und dem Fach. Stehen in einem Feld mehrere Klassen (z. B. "7a, 7b, 7d"), dann haben diese Klassen gemeinsam Unterricht: schreibe sie als EIN Eintrag mit allen Klassen im Feld "klassen". Doppelstunden ergeben zwei Einträge. Lasse Pausen, Aufsichten, Sprechstunden, Konferenzen und Leerstunden weg. Wenn der Plan nur Uhrzeiten und keine Stundennummern enthält, nummeriere die Stunden der Reihenfolge nach. Antworte ausschließlich mit JSON ohne Erklärtext: {"zeiten":[{"stunde":1,"von":"08:00","bis":"08:50"}],"eintraege":[{"wochentag":1,"stunde":3,"klassen":["7a","7b","7d"],"fach":"Geschichte"}]} mit wochentag 1 = Montag bis 5 = Freitag. Lässt sich keine Zeit erkennen, gib "zeiten" als leere Liste zurück.';
  let res;
  if(isImg||(pdfIn&&pdfIn.image)){
    const lim=await sample.limits();if(!lim||!lim.images)throw {message:'Bilder können in dieser Ansicht nicht gelesen werden. Nutze eine PDF oder Textdatei.'};
    res=await sample.json(prompt,{images:[pdfIn&&pdfIn.image?pdfIn.image:await shrinkImage(f)],cache:false});
  }else{
    let txt=pdfIn?pdfIn.text:await f.text();if(ext==='ics')txt=icsToText(txt);
    if(!txt.trim())throw {message:'Die Datei enthält keinen lesbaren Text.'};
    res=await sample.json(prompt+(pdfIn?' Der Inhalt stammt aus einer PDF: Jeder Text steht mit seiner horizontalen Position in eckigen Klammern, Texte mit ähnlicher Position gehören zur selben Spalte (Wochentag laut Kopfzeile).':'')+'\n\nINHALT:\n'+txt.slice(0,14000),{cache:false});
  }
  const arr=(res&&res.eintraege)||[],times={};
  ((res&&res.zeiten)||[]).forEach(z=>{const p=Math.round(+z.stunde),v=String(z.von||'').match(/(\d{1,2}):(\d\d)/),b=String(z.bis||'').match(/(\d{1,2}):(\d\d)/);
    if(p>=1&&p<=14&&v&&b)times[p]={von:pad(+v[1])+':'+v[2],bis:pad(+b[1])+':'+b[2]}});
  const rows=arr.map(x=>{let k=Array.isArray(x.klassen)?x.klassen:(x.klasse?[x.klasse]:[]);k=k.map(c=>String(c).trim()).filter(Boolean);
      return {wd:Math.round(+x.wochentag),period:Math.round(+x.stunde),classes:k,cls:k.join(', '),subject:String(x.fach||'').trim()}})
    .filter(x=>x.wd>=1&&x.wd<=5&&x.period>=1&&x.period<=14&&x.classes.length);
  const seen=new Set();
  return {rows:rows.filter(r=>{const k=r.cls+'|'+r.wd+'|'+r.period;if(seen.has(k))return false;seen.add(k);return true}),times};
}

async function readStudents(f){
  const sample=window.claude&&claude.use?await claude.use('sample'):null;
  if(!sample)throw {message:'Die automatische Erkennung ist in dieser Ansicht nicht verfügbar. Öffne die Seite direkt in Claude.'};
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(!(/^image\//.test(f.type)||['png','jpg','jpeg','webp'].includes(ext)))throw {message:'Bitte ein Bild (Screenshot) verwenden.'};
  const lim=await sample.limits();if(!lim||!lim.images)throw {message:'Bilder können in dieser Ansicht nicht gelesen werden.'};
  const prompt='Das ist ein Screenshot einer Schülerliste (Klassenliste) einer österreichischen Schule, zum Beispiel aus WebUntis. Lies alle Schülerinnen und Schüler Zeile für Zeile aus. Je Person: nachname, vorname, geschlecht und klasse. Das Geschlecht gibst du als "m" (männlich), "w" (weiblich) oder "d" (divers/andere) an, so wie es in der Liste steht. Gibt es keine Geschlechtsspalte, leite es vorsichtig aus dem Vornamen ab und lasse es leer (""), wenn du unsicher bist. Die Klasse (z. B. "7A") nimmst du aus der Liste; steht sie nicht dabei, gib "" an. Erfinde niemanden und lasse niemanden aus, gib nur Personen zurück, die im Bild stehen. Antworte ausschließlich als JSON in dieser Form: {"schueler":[{"nachname":"","vorname":"","geschlecht":"","klasse":""}]}';
  const res=await sample.json(prompt,{images:[await shrinkImage(f)],cache:false});
  const g=v=>{v=String(v||'').trim().toLowerCase();return /^(m|männlich|maennlich|male)/.test(v)?'m':/^(w|f|weiblich|female)/.test(v)?'w':/^(d|x|divers|andere)/.test(v)?'d':''};
  return ((res&&res.schueler)||[]).map(x=>({nn:String(x.nachname||'').trim(),vn:String(x.vorname||'').trim(),g:g(x.geschlecht),kl:String(x.klasse||'').trim()})).filter(x=>x.nn||x.vn);
}

const COLL=['tests','settings'];
const S={tests:{},settings:{}};

/* ---------- Speicher ---------- */
let DB=null;const chains={};
function localLoad(){try{const j=localStorage.getItem('uebersicht-v1');if(j){const o=JSON.parse(j);COLL.forEach(c=>S[c]=o[c]||{})}}catch(e){}}
function localSave(){try{localStorage.setItem('uebersicht-v1',JSON.stringify(S))}catch(e){}}
function queue(k,fn){chains[k]=(chains[k]||Promise.resolve()).catch(()=>{}).then(fn);return chains[k]}
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2600)}
const dirty={};
function put(c,o){S[c][o.id]=o;const dk=c+'/'+o.id;if(DB){dirty[dk]=o;queue(dk,()=>DB.collection(c).doc(o.id).set(o)).then(()=>{if(dirty[dk]===o)delete dirty[dk]},()=>{if(dirty[dk]===o)delete dirty[dk];toast('Speichern fehlgeschlagen')})}else localSave();scheduleRender()}
function del(c,id){delete S[c][id];if(DB)queue(c+'/'+id,()=>DB.collection(c).doc(id).delete()).catch(()=>toast('Löschen fehlgeschlagen'));else localSave();scheduleRender()}
let synced='wait';
async function initDb(){
  try{if(window.claude&&claude.use)DB=await claude.use('db')}catch(e){DB=null}
  if(!DB){synced='local';scheduleRender();return}
  COLL.forEach(c=>{DB.collection(c).onSnapshot(snap=>{const m={};snap.docs.forEach(d=>m[d.id]=d.data());Object.keys(dirty).forEach(k=>{if(k.startsWith(c+'/'))m[k.slice(c.length+1)]=dirty[k]});S[c]=m;if(!snap.metadata.fromCache)synced='ok';scheduleRender()},()=>{synced='err';scheduleRender()})});
}

/* ---------- Hilfen ---------- */
const tt=()=>S.settings.timetable||null;
const HIDE_GROUPS=[];
const ttRows=()=>((tt()&&tt().rows)||[]).filter(r=>{try{const cs=(r.classes&&r.classes.length?r.classes:[r.cls]).map(x=>String(x).trim()).filter(Boolean);return !HIDE_GROUPS.includes(norm(classLabel(cs))+'-'+norm(String(r.subject||'').trim()))}catch(e){return true}});
const dayDiff=s=>Math.round((parse(s)-parse(TODAY))/864e5);
function rel(s){const n=dayDiff(s);return n===0?'heute':n===1?'morgen':n===-1?'gestern':n>0?'in '+n+' Tagen':'vor '+(-n)+' Tagen'}
const dshort=s=>{const d=parse(s);return WD[((d.getDay()+6)%7)+1]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
let rq=false,pending=false;
function editing(){const a=document.activeElement;return a&&a.closest&&a.closest('#main')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)}
let ptrDown=false;
function scheduleRender(){if(editing()||ptrDown){pending=true;return}if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
const ptrUp=()=>{if(!ptrDown)return;ptrDown=false;setTimeout(()=>{if(pending&&!editing()){pending=false;scheduleRender()}},150)};
document.addEventListener('pointerup',ptrUp,true);document.addEventListener('pointercancel',ptrUp,true);
document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>{if(!editing()&&!ptrDown){pending=false;scheduleRender()}},60)});

const autoList=()=>{const a=S.settings.autonom;return a&&Array.isArray(a.list)?a.list:[]};
function holFor(d){
  for(const a of autoList())if(d>=a.from&&d<=(a.to||a.from))return a.name||'Schulautonomer Tag';

/* Doppelstunden: aufeinanderfolgende Stunden mit gleicher Klasse und gleichem Fach werden zu einem Block */
function bigGap(p,q){const T=TIMES(),a=T[p],b=T[q];if(!a||!b)return false;const x=hm(a.bis),y=hm(b.von);return x!=null&&y!=null&&y-x>=15}

  return out;

const plabel=l=>l.p2>l.p?l.p+'.–'+l.p2+'. Stunde (Doppelstunde)':l.p+'. Stunde';
/* Tatsächliche Woche aus WebUntis (Vertretung/Entfall), sonst Regelplan */

function fmtCd(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=sec%60;return h?h+':'+pad(m)+':'+pad(x):pad(m)+':'+pad(x)}

(()=>{const nc=window.confirm.bind(window),np=window.prompt.bind(window);let cur=null,ok=null;

  function dlg(msg,o){o=o||{};return new Promise(res=>{const el=document.createElement('div');el.className='lspop';el.style.zIndex=6000;
